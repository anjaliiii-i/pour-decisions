<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1a1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pour Decisions">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="A pass-the-phone party card game for 2 to 12 players.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour Decisions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Playfair+Display:ital,wght@1,700;1,800&family=Figtree:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen bar-table app. Player rail on top, a single big card in the middle, actions below. Deliberately single dark theme (a dim bar). */
:root {
  color-scheme: dark;
  --bg: #1a1220;
  --bg-2: #241a2c;
  --line: #3a2d44;
  --fg: #f5ecdf;
  --muted: #b3a5b8;
  --amber: #f4a940;
  --dare: #ff6b57;
  --truth: #5cc8ff;
  --rule: #f4c542;
  --all: #4fd6a3;
  --duel: #b38cff;
  --gift: #ff7fb5;
  --cat: #f49a52;
  --secret: #9bd84f;
  --water: #7aa7ff;
  --card-ink: #1a1220;
  --display: "Shrikhand", "Georgia", serif;
  --body: "Figtree", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #2c1d36 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
}
.app {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; gap: 18px;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
h1 { font-family: var(--display); font-weight: 400; font-size: 2.6rem; line-height: 1; margin: 0; color: var(--amber); text-wrap: balance; letter-spacing: .01em; }
h2 { font-family: var(--display); font-weight: 400; font-size: 1.7rem; margin: 0; color: var(--fg); text-wrap: balance; }
.tag { color: var(--muted); margin: 6px 0 0; line-height: 1.45; }
.label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* setup */
.panel { background: var(--bg-2); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--fg); font: inherit; }
.btn { background: var(--amber); color: var(--card-ink); font-weight: 800; padding: 12px 18px; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); font-weight: 600; }
.btn.small { padding: 8px 12px; font-size: .88rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.roster { display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 10px 14px; }
.prow .pn { font-weight: 800; align-self: center; min-width: 0; overflow-wrap: anywhere; }
.prow .x { width: 30px; height: 30px; border-radius: 50%; background: var(--line); }
.prow .opts { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.prow select, .prow input, .field { min-width: 0; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; color: var(--fg); font: inherit; font-size: .88rem; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; }
.seg button { background: var(--bg); border: 1px solid var(--line); padding: 10px 6px; font-weight: 600; font-size: .92rem; }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--card-ink); border-color: var(--amber); }
.hint { color: var(--muted); font-size: .88rem; line-height: 1.45; margin: 0; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: .88rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; background: var(--c); vertical-align: -1px; }
.table-code { font-family: var(--mono); font-size: 1.6rem; letter-spacing: .2em; color: var(--amber); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .field { flex: 1 1 120px; }

/* game */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.top h1 { font-size: 1.6rem; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.rail { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; background: var(--bg-2); border: 1px solid var(--line); padding: 8px 12px; min-width: 76px; text-align: left; transition: transform .15s; }
.chip .n { font-weight: 800; font-size: .95rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .s { font-family: var(--mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip .pm { font-family: var(--mono); font-size: .78rem; color: var(--fg); font-variant-numeric: tabular-nums; }
.chip.now { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
.chip.now .s { color: var(--amber); }
.chip.pick { border-color: var(--gift); animation: pulse 1s infinite; }
.chip.bump { transform: scale(1.08); }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--gift) 35%, transparent); } }

.turn { text-align: center; }
.turn strong { font-family: var(--display); font-weight: 400; font-size: 1.9rem; color: var(--fg); display: block; line-height: 1.1; margin-top: 4px; overflow-wrap: anywhere; }

.stage { perspective: 1200px; display: flex; justify-content: center; }
.card {
  --c: var(--amber);
  width: 100%; max-width: 360px; aspect-ratio: 5 / 7; max-height: 56vh;
  background: var(--fg); color: var(--card-ink);
  border-radius: 22px; padding: 22px; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 8px var(--c) inset;
  position: relative;
}
.card.flip { animation: flip .45s cubic-bezier(.2,.8,.2,1); }
@keyframes flip { from { transform: rotateY(90deg) translateY(10px); opacity: .3; } to { transform: none; opacity: 1; } }
.card .kind { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px 0; gap: 8px; }
.card .kind b { font-family: var(--display); font-weight: 400; font-size: 1.5rem; color: var(--c); filter: brightness(.82); }
.card .kind i { font-style: normal; font-family: var(--mono); font-size: .8rem; background: var(--card-ink); color: var(--fg); padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.card .txt { flex: 1; display: flex; align-items: center; padding: 0 6px; font-size: clamp(1.15rem, 4.6vw, 1.45rem); line-height: 1.35; font-weight: 600; text-wrap: pretty; overflow-wrap: anywhere; overflow-y: auto; }
.card .txt em { font-style: normal; font-weight: 800; background: color-mix(in srgb, var(--c) 35%, transparent); padding: 0 4px; border-radius: 4px; }
.card .foot { font-size: .8rem; color: #6b5d70; text-align: center; padding-bottom: 6px; }
.card .timer { align-self: center; font-family: var(--mono); font-size: .95rem; background: var(--card-ink); color: var(--fg); padding: 8px 14px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.card .timer.run { background: var(--c); color: var(--card-ink); }
.card .timer.out { background: var(--dare); color: var(--card-ink); }
.card.back { background: var(--bg-2); color: var(--fg); box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 1px var(--line) inset; align-items: center; justify-content: center; text-align: center; cursor: pointer; background-image: repeating-linear-gradient(45deg, transparent 0 14px, rgba(244,169,64,.07) 14px 28px); }
.card.back .big { font-family: var(--display); font-size: 2.6rem; color: var(--amber); }
.card.back p { color: var(--muted); margin: 0; }
.card.hidden { background: #233019; color: var(--fg); box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 8px var(--secret) inset; align-items: center; justify-content: center; text-align: center; }
.card.hidden .big { font-family: var(--display); font-size: 2rem; color: var(--secret); }
.card.hidden p { margin: 0; color: var(--muted); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.actions .btn { flex: 1 1 140px; }
.refill { background: var(--bg-2); border: 1px solid var(--amber); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.refill b { font-family: var(--display); font-weight: 400; font-size: 1.3rem; color: var(--amber); }
.refill p { margin: 0; color: var(--fg); line-height: 1.4; font-size: .95rem; }
.refill .row .btn { flex: 1 1 130px; }
.picker { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.picker .who { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.picker .who button { background: var(--bg-2); border: 1px solid var(--line); padding: 10px 14px; font-weight: 600; }
.picker .who button[aria-pressed="true"] { background: var(--all); border-color: var(--all); color: var(--card-ink); }
.picker .row .btn { flex: 1 1 0; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.list li { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; background: var(--bg-2); border-left: 3px solid var(--rule); border-radius: 8px; padding: 10px 10px 10px 12px; font-size: .92rem; line-height: 1.4; }
.list li > span { flex: 1 1 180px; min-width: 0; }
.list li small { color: var(--muted); display: block; }
.list li .plain { background: transparent; color: var(--muted); padding: 2px 6px; }
.list.missions li { border-left-color: var(--secret); }
.board ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.board li { display: grid; grid-template-columns: minmax(0, 7rem) 1fr auto; align-items: center; gap: 10px; font-size: .9rem; }
.board li .bn { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .bar { height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.board .bar span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--all), var(--amber) 55%, var(--dare)); background-size: 100vw 100%; }
.board .bv { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; min-width: 4.5rem; }
.board .bv small { display: block; font-family: var(--body); color: var(--muted); font-size: .72rem; }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.award { background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.award b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; color: var(--amber); }
.award strong { font-size: 1.1rem; overflow-wrap: anywhere; }
.award span { color: var(--muted); font-size: .85rem; font-family: var(--mono); }
/* welcome */
.welcome { min-height: calc(100vh - 60px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; padding-block: 12px; }
.fan { position: relative; width: 280px; max-width: 100%; height: 236px; }
/* Intro: a pinwheel spread of card faces, like a hand of playing cards tossed on the table.
   On load the cards fan out from one pile into their angles, then the whole spread sways slowly. */
.spread { position: absolute; left: calc(50% + 14px); top: 50%; width: 0; height: 0; animation: sway 7s ease-in-out 3.8s infinite; }
.pc {
  --c: var(--dare); --r: 0deg; --x: 0px; --y: 0px; --k: 1;
  position: absolute; left: -62px; top: -86px; width: 124px; height: 172px; box-sizing: border-box;
  background: var(--fg); border-radius: 14px; padding: 10px 11px;
  box-shadow: 0 0 0 1px #d9cdbb inset, -4px 8px 18px rgba(0,0,0,.45);
  transform: translate(var(--x), var(--y)) rotate(var(--r));
  animation: flyin 2.8s both;
}
.pc .corner { display: flex; flex-direction: column; align-items: center; width: 26px; line-height: 1; color: var(--c); filter: brightness(.8); }
.pc .corner b { font-family: var(--display); font-weight: 400; font-size: 1.5rem; }
.pc .corner i { font-style: normal; font-family: var(--display); font-size: 1rem; margin-top: 2px; }
.pc .pip { position: absolute; right: 16px; bottom: 14px; font-family: var(--display); font-size: 3.6rem; line-height: 1; color: var(--c); filter: brightness(.8); }
.pc .name { position: absolute; left: 12px; bottom: 16px; font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: var(--c); filter: brightness(.7); }
/* Each card flies in spinning from its own edge of the screen, lands loosely in a messy pile,
   then glides calmly into the fan. Tap the spread to throw them in again. */
@keyframes flyin {
  0%   { transform: translate(calc(var(--fx) * var(--k)), calc(var(--fy) * var(--k))) rotate(var(--fr)); animation-timing-function: cubic-bezier(.15,.6,.3,1); }
  42%  { transform: translate(calc(var(--x) + var(--ox)), calc(var(--y) + var(--oy))) rotate(calc(var(--r) + var(--or))); animation-timing-function: cubic-bezier(.45,0,.25,1); }
  100% { transform: translate(var(--x), var(--y)) rotate(var(--r)); }
}
html, body { overflow-x: clip; }
.spread-wrap { position: absolute; inset: 0; }

/* Halloween Special: pumpkin accent, moonlit background, and an original cartoon vampire whose cards land on his table. */
body.spooky { --amber: #ff8a3d; background: radial-gradient(120% 70% at 50% 0%, #1f2650 0%, #171230 45%, var(--bg) 75%) fixed, var(--bg); }
.scene { position: absolute; left: 50%; top: 0; width: 340px; max-width: 100vw; height: auto; transform: translateX(-50%); }
.fan.scened { width: 340px; height: 300px; }
.fan.scened .spread-wrap { transform: translateY(96px) scale(.58); }
.fan.scened .pc { --k: 1.73; } /* undo the .58 scale so fly-in starts stay off-screen */
.fan.scened .bubbles { display: none; }
.scene .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.6s ease-in-out infinite; }
.scene .flame.b { animation-duration: 2.1s; animation-delay: -.7s; }
.scene .glow { animation: glowpulse 2.4s ease-in-out infinite; }
.scene .bat { animation: flap .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
.scene .bats { animation: drift 9s ease-in-out infinite; }
@keyframes flicker { 0%, 100% { transform: scale(1, 1) rotate(-2deg); } 40% { transform: scale(.9, 1.12) rotate(3deg); } 70% { transform: scale(1.05, .94) rotate(-1deg); } }
@keyframes glowpulse { 50% { opacity: .55; } }
@keyframes flap { to { transform: scaleY(.55); } }
@keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-14px, 6px); } }
/* Plain black bats that cross the screen now and then during the game (Halloween Special only). */
#batLayer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
.toast { z-index: 6; }
.bat-fly { position: absolute; left: 0; top: 0; }
.bat-fly svg { display: block; width: 100%; height: auto; }
.bat-fly .wings { transform-box: fill-box; transform-origin: 50% 40%; animation: flap .16s ease-in-out infinite alternate; }
.cat-walk .leg { transform-box: fill-box; transform-origin: 50% 0; animation: step .42s ease-in-out infinite alternate; }
.cat-walk .leg.b { animation-delay: -.42s; }
.cat-walk .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: tailsway 1.4s ease-in-out infinite alternate; }
@keyframes step { from { transform: rotate(16deg); } to { transform: rotate(-16deg); } }
@keyframes tailsway { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }

/* Awards: the black cat sits on top of the Highest flyer card, blinking, swishing its tail and now and then licking a paw. */
.awards { margin-top: 44px; }
body.spooky .awards { margin-top: 100px; }

/* Christmas Special: festive red accent, a pine-dark night sky, gentle snowfall over everything, and a tree scene on welcome. */
body.xmas { --amber: #ff5a5f; background: radial-gradient(120% 70% at 50% 0%, #11383a 0%, #102131 45%, var(--bg) 75%) fixed, var(--bg); }
body.xmas .hero { text-shadow: 0 4px 0 #6e1a20; }
#snowLayer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 4; display: none; }
body.xmas #snowLayer { display: block; }
#snowLayer i { position: absolute; top: -12px; width: var(--s); height: var(--s); border-radius: 50%; background: #fff; opacity: var(--o); animation: snowfall var(--d) linear var(--delay) infinite; }
@keyframes snowfall { to { transform: translate(var(--drift), 105vh); } }
.scene .twinkle { animation: twinkle 1.8s ease-in-out infinite; }
.scene .twinkle:nth-of-type(2n) { animation-delay: -.6s; }
.scene .twinkle:nth-of-type(3n) { animation-delay: -1.2s; }
@keyframes twinkle { 50% { opacity: .35; } }
.runner .leg { transform-box: fill-box; transform-origin: 50% 0; animation: run .26s ease-in-out infinite alternate; }
.runner .leg.b { animation-delay: -.26s; }
@keyframes run { from { transform: rotate(28deg); } to { transform: rotate(-28deg); } }
@media (prefers-reduced-motion: reduce) { #snowLayer { display: none !important; } }
.award.perch { position: relative; }
.cat-sit { position: absolute; right: 6px; top: -104px; width: 96px; pointer-events: none; }
.cat-sit svg { display: block; width: 100%; height: auto; overflow: visible; }
.cat-sit .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
.cat-sit .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: tailsway 2.4s ease-in-out infinite alternate; }
/* Lick: the standing front leg swaps for a bent foreleg curled up to the mouth (toe beans facing the tongue);
   the paw bobs against the tongue a few times, the head tips into it, then the leg goes back down. */
.cat-sit .paw { animation: restpaw 6s ease-in-out infinite; }
.cat-sit .raised { opacity: 0; animation: raisepaw 6s ease-in-out infinite; }
.cat-sit .lickpaw { animation: lickbob 6s ease-in-out infinite; }
.cat-sit .tongue { opacity: 0; animation: tongue 6s ease-in-out infinite; }
.cat-sit .head { transform-box: fill-box; transform-origin: 50% 90%; animation: nod 6s ease-in-out infinite; }
@keyframes blink { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
@keyframes restpaw { 0%, 54%, 94%, 100% { opacity: 1; } 58%, 90% { opacity: 0; } }
@keyframes raisepaw { 0%, 54%, 94%, 100% { opacity: 0; } 58%, 90% { opacity: 1; } }
@keyframes lickbob {
  0%, 60%, 70%, 80%, 90%, 100% { transform: translate(0, 0); }
  65%, 75%, 85% { transform: translate(-1px, -1.6px); }
}
@keyframes tongue { 0%, 62%, 88%, 100% { opacity: 0; } 65%, 85% { opacity: 1; } }
@keyframes nod { 0%, 56%, 92%, 100% { transform: rotate(0); } 62%, 86% { transform: rotate(5deg) translateY(1px); } }
@media (prefers-reduced-motion: reduce) { .cat-sit * { animation: none !important; } }
.special { display: inline-block; margin-bottom: 10px; font-size: .75rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--card-ink); background: var(--amber); padding: 5px 12px; border-radius: 999px; }
@keyframes sway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
.fan { cursor: pointer; -webkit-tap-highlight-color: transparent; background: none; padding: 0; border-radius: 24px; display: block; }
.bubbles { position: absolute; inset: -20px 0 0; pointer-events: none; }
.bubbles i { position: absolute; bottom: 0; width: 10px; height: 10px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--amber) 70%, transparent); opacity: 0; animation: rise 4s ease-in infinite; }
.bubbles i:nth-child(1) { left: 12%; animation-delay: 1s; }
.bubbles i:nth-child(2) { left: 30%; width: 6px; height: 6px; animation-delay: 2.2s; }
.bubbles i:nth-child(3) { left: 70%; animation-delay: 1.6s; }
.bubbles i:nth-child(4) { left: 86%; width: 7px; height: 7px; animation-delay: 3s; }
.bubbles i:nth-child(5) { left: 52%; width: 5px; height: 5px; animation-delay: 3.6s; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-230px) translateX(8px); opacity: 0; } }
.hero { font-size: clamp(3.2rem, 15vw, 4.8rem); line-height: .92; text-shadow: 0 4px 0 #6b3f12; animation: pop .6s cubic-bezier(.2,.9,.25,1.4) .55s both; }
@keyframes pop { from { transform: scale(.6) rotate(-4deg); opacity: 0; } }
.welcome .sub { color: var(--fg); font-family: "Playfair Display", "Times New Roman", Times, serif; font-style: italic; font-weight: 700; font-size: 1.3rem; line-height: 1.3; max-width: 24ch; margin: 0; text-wrap: balance; }

  if (!THEMES[s.theme]) s.theme = s.spooky === true ? "halloween" : s.spooky === false ? "classic" : seasonTheme();
  delete s.spooky;
  return s;
}
function newPlayer(p) {
  const n = Object.assign({ sips: 0, drink: "beer", kg: 70, body: "x", first: 0, peak: 0, refused: 0, done: 0, made: 0, won: 0, water: 0, lastPicked: 0, sinceRefill: 0, nursed: 0 }, p);
  if (!GLASSES[n.glass]) n.glass = (DRINKS[n.drink] || DRINKS.beer).glass;
  return n;
}

function save() {
  try { localStorage.setItem("pd-state", JSON.stringify(S)); localStorage.setItem("pd-local", JSON.stringify({ code: L.code, me: L.me })); } catch {}
}
function load() { try { return JSON.parse(localStorage.getItem("pd-state")) || {}; } catch { return {}; } }
function loadLocal() { try { return JSON.parse(localStorage.getItem("pd-local")) || {}; } catch { return {}; } }

// Every change to the game goes through here so it can be undone and synced.
function mutate(fn, record = true) {
  const before = record ? JSON.stringify(Object.assign({}, S, { history: [] })) : null;
  fn();
  if (record) { S.history.push(before); if (S.history.length > 10) S.history.shift(); }
  render();
  push();
}
function undo() {
  const prev = S.history.pop();
  if (!prev) return toast("Nothing to undo");
  const history = S.history;
  S = fresh(JSON.parse(prev));
  S.history = history;
  L.reveal = false;
  toast("Undone");
  render();
  push();
}

const effLevel = () => S.level === 4 ? (S.round <= 3 ? 1 : S.round <= 6 ? 2 : 3) : S.level;
// Spicy leaves out the chill cards so the 18+ ones come up often. Halloween cards ("h") only join the Halloween Special.
const inLevel = (c, lv = effLevel()) => (c[5] !== "h" || S.theme === "halloween") && (c[5] !== "x" || S.theme === "christmas") && (lv === 3 ? c[1] >= 2 : c[1] <= lv);
function buildDeck() { S.deckLevel = effLevel(); S.deck = shuffle(DECK.map((c, i) => i).filter(i => inLevel(DECK[i]))); }

// Pick the other players who were picked least recently, so nobody gets hit every turn.
function others(n) {
  const pool = shuffle(S.players.map((_, i) => i).filter(i => i !== S.turn));
  pool.sort((a, b) => S.players[a].lastPicked - S.players[b].lastPicked);
  const out = pool.slice(0, n);
  out.forEach(i => S.players[i].lastPicked = S.tick);
  return out;
}
function leader() {
  const max = Math.max(...S.players.map(p => p.sips));
  return shuffle(S.players.map((_, i) => i).filter(i => S.players[i].sips === max))[0];
}

function draw() {
  mutate(() => {
    S.tick++;
    const me = S.players[S.turn];
    if (promille(me) >= WATER_AT && Math.random() < .35) {
      S.card = { kind: "water", sips: 0, text: "Water break, {p}. Your estimate just passed 1‰. Finish a glass of water before your next turn, then you're back in.", p: S.turn, o: S.turn, q: S.turn, lead: S.turn, timer: 0 };
      return;
    }
    if (!S.deck.length || S.deckLevel !== effLevel()) buildDeck();
    const [kind, , sips, text, timer] = DECK[S.deck.pop()];
    const [o, q] = others(2);
    const lead = leader();
    const c = { kind, sips, text, p: S.turn, o: o ?? S.turn, q: q ?? o ?? S.turn, lead, timer: timer || 0 };
    if (kind === "duel" && text.includes("{lead}")) c.o = lead !== S.turn ? lead : c.o;
    S.card = c;
    S.picked = []; S.votes = {};
    if (kind === "gift") S.gift = sips;
  });
  L.reveal = false; L.timerEnd = 0;
  flipNext = true;
  render();
}

function fill(c, text = c.text) {
  const name = i => `<em>${esc(S.players[i].name)}</em>`;
  return esc(text).replace(/\{p\}/g, name(c.p)).replace(/\{o\}/g, name(c.o)).replace(/\{q\}/g, name(c.q)).replace(/\{lead\}/g, name(c.lead));
}

function sip(i, n) {
  const p = S.players[i];
  if (!p.first) p.first = Date.now();
  p.sips += n;
  p.peak = Math.max(p.peak, promille(p));
  // Refill check: once the counted sips add up to a full glass, ask whether it's really empty.
  p.sinceRefill = (p.sinceRefill || 0) + n;
  S.refills = S.refills || [];
  if (p.sinceRefill >= glassSips(p) && !S.refills.includes(i)) S.refills.push(i);
}
// How many sips the game counts as one full glass for this player (a pint is about 14, a martini glass about 8).
const glassSips = p => Math.max(1, Math.round(glassOf(p).ml / glassOf(p).sip));
function addSips(i, n) {
  sip(i, n);
  toast(`${S.players[i].name} +${n} sip${n > 1 ? "s" : ""}`);
  bump(i);
}
function bump(i) {
  requestAnimationFrame(() => {
    const el = document.querySelector(`.chip[data-i="${i}"]`);
    if (el) { el.classList.add("bump"); setTimeout(() => el.classList.remove("bump"), 180); }
  });
}

// Called inside mutate().
function next() {
  S.card = null; S.gift = 0; S.picked = []; S.votes = {};
  S.turn = (S.turn + 1) % S.players.length;
  if (S.turn === 0) {
    S.round++;
    if (S.length && S.round > S.length) S.over = true;
  }
  L.reveal = false; L.timerEnd = 0;
}

let toastT;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800);
}

  <div class="row">
    <button class="btn" id="start" style="flex:1" ${ok ? "" : "disabled"}>${started ? "Resume game" : "Start game"}</button>
    ${started ? `<button class="btn ghost" id="reset">New game</button>` : ""}
  </div>
  <p class="foot-note">Sips can be water. Know your limit, drink water between rounds, and never drive after playing.</p>`;
}

function tableView() {
  if (L.code) {
    return `<section class="panel" aria-labelledby="tb">
      <div class="label" id="tb">Playing on several phones</div>
      <div class="row"><span class="table-code">${esc(L.code)}</span><span class="hint" style="flex:1">${L.sync === "live" ? "Live. Every change shows on all phones at this table." : "Connecting…"}</span></div>
      <label class="hint" for="meSel">Who's holding this phone?</label>
      <select id="meSel" class="field">
        <option value="-1">Just watching</option>
        ${S.players.map((p, i) => `<option value="${i}"${L.me === i ? " selected" : ""}>${esc(p.name)}</option>`).join("")}
      </select>
      <p class="hint">Friends open this same link and join with the code. They need Contributor access to play; view-only friends can't join.</p>
      <button class="btn ghost" id="leave">Leave table</button>
    </section>`;
  }
  // Outside claude.ai (e.g. on GitHub Pages) there is no sync at all, so don't mention it.
  if (!db && !window.claude) return "";
  if (!db) {
    return `<section class="panel" aria-labelledby="tb">
      <div class="label" id="tb">Playing on several phones</div>
      <p class="hint">${dbTried ? "Sign in to claude.ai and open this page from its link to play on several phones. One phone works fine without it." : "Checking whether this page can sync…"}</p>
    </section>`;
  }
  return `<section class="panel" aria-labelledby="tb">
    <div class="label" id="tb">Playing on several phones</div>
    <p class="hint">Start a table and everyone with the link joins with its code. Each phone sees the board, votes on showdowns and gets its own secret missions.</p>
    <div class="row">
      <button class="btn" id="host" type="button">Start a table</button>
      <input id="joinCode" type="text" class="field" placeholder="Code" maxlength="4" autocomplete="off" aria-label="Table code" style="text-transform:uppercase">
      <button class="btn ghost" id="join" type="button">Join</button>
    </div>
  </section>`;
}

function gameView(flip) {
  const c = S.card, cur = S.players[S.turn];
  const rail = `<div class="rail" role="list">${S.players.map((p, i) => `
    <button type="button" role="listitem" class="chip${i === S.turn ? " now" : ""}${S.gift && i !== S.turn ? " pick" : ""}" data-i="${i}" aria-label="${esc(p.name)}, ${p.sips} sips. Add a sip">
      <span class="n">${esc(p.name)}${i === L.me ? " (you)" : ""}</span><span class="s">${p.sips} sip${p.sips === 1 ? "" : "s"}</span><span class="pm">~${fmt(promille(p))}</span>
    </button>`).join("")}</div>`;

  let card, actions;
  if (!c) {
    card = `<button type="button" class="card back" id="drawBtn" aria-label="Draw a card"><span class="big">Draw</span><p>Tap to flip the next card</p><p style="font-family:var(--mono);font-size:.8rem">${S.deck.length || "fresh"} left in deck${S.level === 4 ? ` · ${LEVELS[effLevel() - 1][0]}` : ""}</p></button>`;
    actions = `<button class="btn ghost" id="skipTurn">Skip turn</button>`;
  } else if (c.kind === "secret" && !canSee(c.p)) {
    card = `<div class="card hidden"><span class="big">Secret Mission</span><p>Only ${esc(S.players[c.p].name)}'s phone can open this.</p></div>`;
    actions = `<button class="btn ghost" data-act="done">Skip it</button>`;
  } else if (c.kind === "secret" && !L.reveal) {
    card = `<div class="card hidden${flip ? " flip" : ""}"><span class="big">Secret Mission</span><p>For ${esc(S.players[c.p].name)} only. Everyone else, look away.</p></div>`;
    actions = `<button class="btn" id="reveal">${esc(S.players[c.p].name)}: show me</button>`;
  } else {
    const k = KINDS[c.kind];
    const badge = c.kind === "water" ? "no sips" : c.sips ? `${c.sips} sip${c.sips > 1 ? "s" : ""}` : "stays in play";
    card = `<article class="card${flip ? " flip" : ""}" style="--c:var(${k.c})">
      <div class="kind"><b>${k.name}</b><i>${badge}</i></div>
      <div class="txt"><div>${fill(c)}</div></div>
      ${c.timer ? `<button type="button" class="timer" id="timerBtn">Start ${c.timer}s timer</button>` : ""}
      <div class="foot">${footFor(c)}</div>
    </article>`;
    actions = actionsFor(c);
  }

  const missions = S.missions.length ? `<section class="list missions" aria-labelledby="ms"><div class="label" id="ms">Secret missions in play · ${S.missions.length}</div><ul>
    ${S.missions.map((m, i) => `<li><span>${canSee(m.p) && L.peek[m.id] ? fill(m, m.text) : `${esc(S.players[m.p].name)} is up to something.`}<small>${m.sips} sips on the line</small></span>
      ${canSee(m.p) ? `<button type="button" class="plain" data-peek="${m.id}">${L.peek[m.id] ? "Hide" : "Peek"}</button>` : ""}
      <button type="button" class="btn small" data-mission="${i}" data-ok="1">Pulled it off</button>
      <button type="button" class="btn ghost small" data-mission="${i}" data-ok="0">Busted</button></li>`).join("")}
  </ul></section>` : "";

  const rules = S.rules.length ? `<section class="list" aria-labelledby="rl"><div class="label" id="rl">Rules in play · ${S.rules.length}</div><ul>
    ${S.rules.map((r, i) => `<li><span>${r.text ? fill(r, r.text) : esc(String(r.html || "").replace(/<[^>]*>/g, ""))}<small>Made by ${esc(r.by)}</small></span><button type="button" class="plain" data-clr="${i}" aria-label="Clear rule">Clear</button></li>`).join("")}
  </ul></section>` : "";

  return `
  <div class="top"><h1>Pour Decisions</h1>
    <div class="tools">
      <button class="btn ghost small" id="undo" ${S.history.length ? "" : "disabled"}>Undo</button>
      <button class="btn ghost small" id="end">End night</button>
      <button class="btn ghost small" id="menu">Setup</button>
    </div>
  </div>
  ${rail}
  ${refillView()}
  <div class="turn"><span class="label">Round ${S.round}${S.length ? ` of ${S.length}` : ""} · up now</span><strong>${esc(cur.name)}</strong></div>
  <div class="stage">${card}</div>
  <div class="actions">${actions}</div>
  ${missions}
  ${rules}
  ${boardView()}
  ${L.code ? `<p class="sync">Table <b>${esc(L.code)}</b> · ${L.sync === "live" ? "synced" : "connecting…"}</p>` : ""}`;
}

// Refill check for the first player in the queue. Not empty when the count says it should be? Finish the drink.
// Water and shots just get a nudge, and past the water-break line the game suggests water instead of a penalty.
function refillView() {
  const i = (S.refills || [])[0];
  if (i === undefined || !S.players[i]) return "";
  const p = S.players[i], d = DRINKS[p.drink] || DRINKS.beer, g = glassOf(p), name = esc(p.name);
  const box = (title, text, buttons) => `<section class="refill" aria-live="polite"><b>${title}</b><p>${text}</p><div class="row">${buttons}</div></section>`;
  if (S.penalty === i) return box(`Down it, ${name}!`, `Your ${esc(d.name.toLowerCase())} wasn't empty. Penalty: finish what's left, then pour a fresh one.`,
    `<button class="btn" data-refill="finished">Finished, refilled</button>`);
  if (p.drink === "none") return box(`Water check, ${name}`, `That's about a full ${esc(g.name.toLowerCase())} of water. Time to top up.`,
    `<button class="btn" data-refill="ok">Topped up</button>`);
  if (p.drink === "shot") return box(`Shot's gone, ${name}?`, `Pour the next one when you're ready.`,
    `<button class="btn" data-refill="ok">Poured</button>`);
  if (promille(p) >= WATER_AT) return box(`Refill time, ${name}`, `You're past ${WATER_AT}‰ by the estimate, so how about a water this round? No penalty either way.`,
    `<button class="btn" data-refill="water">Water it is</button><button class="btn ghost" data-refill="ok">Refilled</button>`);
  return box(`Refill check, ${name}`, `By the count, that's a full ${esc(d.name.toLowerCase())} (${esc(g.name)}). Is the glass empty? If not, you finish it.`,
    `<button class="btn" data-refill="ok">Empty, refilled</button><button class="btn ghost" data-refill="left">Still some left</button>`);
}

// On a shared table only the player's own phone opens their secrets; on one phone anyone can.
const canSee = p => !L.code || L.me === p;

function boardView() {
  const rows = S.players.map(p => ({ p, v: promille(p) })).sort((a, b) => b.v - a.v);
  return `<section class="panel board" aria-labelledby="pb">
    <div class="label" id="pb">Promille board · rough estimate</div>
    <ul>${rows.map(({ p, v }) => `<li>
      <span class="bn">${esc(p.name)}<small style="display:block;color:var(--muted);font-weight:400;font-size:.75rem">≈ ${glasses(p).toFixed(1)} ${esc(glassOf(p).name.split(" ")[0].toLowerCase())}s</small></span>
      <span class="bar"><span style="width:${Math.min(100, v / 2 * 100)}%"></span></span>
      <span class="bv">~${fmt(v)}<small>${tier(v)}</small></span>
    </li>`).join("")}</ul>
    <p class="hint">Widmark estimate from sips, drink, glass, weight and body type, minus about ${BURN}‰ per hour since each player's first sip. Past ${WATER_AT}‰ the game starts dealing water breaks. Food and real sip sizes change everything, so treat this as a joke, never as a reason to drive.</p>
  </section>`;
}

function footFor(c) {
  return {
    dare: `Do it, or drink ${c.sips}.`,
    truth: `Answer honestly, or drink ${c.sips}.`,
    rule: "Adds to the rules list below.",
    all: "Tap who drinks below, then confirm.",
    duel: L.code ? `Everyone votes for the loser. Loser drinks ${c.sips}.` : `Loser drinks ${c.sips}.`,
    gift: S.gift ? `${S.gift} left to hand out. Tap a player above.` : "All handed out.",
    cat: "Tap who lost below, then confirm.",
    secret: `Pull it off and ${esc(S.players[c.o].name)} drinks ${c.sips}. Get caught and you do.`,
    water: "No sips this turn. Everyone toasts the hydration hero.",
  }[c.kind];
}

function actionsFor(c) {
  const P = S.players;
  switch (c.kind) {
    case "dare": case "truth":
      return `<button class="btn" data-act="done">Done it</button><button class="btn ghost" data-act="refuse">Drink ${c.sips} instead</button>`;
    case "rule":
      return `<button class="btn" data-act="rule">Add rule & pass</button>`;
    case "all": case "cat":
      return pickerView(c);
    case "duel":
      return L.code ? voteView(c) : `<button class="btn ghost" data-act="lose" data-who="${c.p}">${esc(P[c.p].name)} lost</button><button class="btn ghost" data-act="lose" data-who="${c.o}">${esc(P[c.o].name)} lost</button>`;
    case "gift":
      return S.gift ? `<button class="btn ghost" data-act="done">Skip the rest</button>` : `<button class="btn" data-act="done">Next player</button>`;
    case "secret":
      return `<button class="btn" data-act="mission">Accept & hide</button>`;
    case "water":
      return `<button class="btn" data-act="water">Water's done, next</button>`;
    default:
      return `<button class="btn" data-act="done">Next player</button>`;
  }
}

// Only the players tapped here get the card's sips.
function pickerView(c) {
  const n = S.picked.length;
  return `<div class="picker">
    <div class="label" style="text-align:center">Who drinks ${c.sips}?</div>
    <div class="who">${S.players.map((p, i) => `<button type="button" data-pick="${i}" aria-pressed="${S.picked.includes(i)}">${esc(p.name)}</button>`).join("")}</div>
    <div class="row">
      <button class="btn ghost" data-act="pickall">${n === S.players.length ? "Clear all" : "Everyone"}</button>
      <button class="btn" data-act="pickdone">${n === 1 ? `${esc(S.players[S.picked[0]].name)} drinks, next` : n ? `${n} drink, next` : "Nobody, next"}</button>
    </div>
  </div>`;
}

// Shared tables vote on showdowns: one vote per phone, majority loses, a tie means both drink.
function voteView(c) {
  const tally = who => Object.values(S.votes).filter(v => v === who).length;
  const mine = S.votes[L.me];
  const can = L.me >= 0;
  return `<div class="picker">
    <div class="label" style="text-align:center">${can ? "Who lost? Vote from your phone" : "Pick who you are in Setup to vote"}</div>
    <div class="who">${[c.p, c.o].map(i => `<button type="button" data-vote="${i}" aria-pressed="${mine === i}" ${can ? "" : "disabled"}>${esc(S.players[i].name)} lost · ${tally(i)}</button>`).join("")}</div>
    <div class="row"><button class="btn" data-act="settle" ${Object.keys(S.votes).length ? "" : "disabled"}>Settle the vote</button></div>
  </div>`;
}

function awardsView() {
  const P = S.players;
  const best = (fn, unit, min = 1) => {
    const top = Math.max(...P.map(fn));
    if (!(top >= min)) return null;
    return { who: P.filter(p => fn(p) === top).map(p => p.name).join(" & "), val: unit(top) };
  };
  const list = [
    ["Thirstiest", best(p => p.sips, v => `${v} sips`)],
    ["Highest flyer", best(p => Math.max(p.peak, promille(p)),v => `peaked at ~${fmt(v)}`, .01)],
    ["Daredevil", best(p => p.done, v => `${v} dares and truths done`)],
    ["Chicken of the night", best(p => p.refused, v => `${v} refused`)],
    ["Lawmaker", best(p => p.made, v => `${v} rule${v > 1 ? "s" : ""} made`)],
    ["Secret agent", best(p => p.won, v => `${v} mission${v > 1 ? "s" : ""} pulled off`)],
    ["Hydration hero", best(p => p.water, v => `${v} water break${v > 1 ? "s" : ""}`)],
    ["Tiny Sipper", best(p => p.nursed || 0, v => `${v} glass${v > 1 ? "es" : ""} not empty at refill`)],
    ["Lightweight", best(p => -p.sips, v => `only ${-v} sips`, -Infinity)],
  ].filter(a => a[1]);
  return `
  <header><h1>Pour Decisions</h1><p class="tag">That's the night. ${P.length} players, ${P.reduce((n, p) => n + p.sips, 0)} sips in total.</p></header>
  <h2>The awards</h2>
  <div class="awards">${list.map(([t, a], i) => {
    const perch = S.theme === "halloween" && (t === "Highest flyer" || (i === 0 && !list.some(x => x[0] === "Highest flyer")));
    return `<div class="award${perch ? " perch" : ""}">${perch ? `<div class="cat-sit" aria-hidden="true">${CAT_SIT_SVG}</div>` : ""}<b>${t}</b><strong>${esc(a.who)}</strong><span>${esc(a.val)}</span></div>`;
  }).join("")}</div>
  ${boardView()}
  <div class="row">
    <button class="btn" id="again" style="flex:1">Play again</button>
    <button class="btn ghost" id="undo" ${S.history.length ? "" : "disabled"}>Undo</button>
    <button class="btn ghost" id="menu">Setup</button>
  </div>
  <p class="foot-note">Get everyone home safe. Order a ride, nobody drives.</p>`;
}

// Timers run on each phone separately.
let audio;
function beep() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.2, audio.currentTime); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .6);
    o.start(); o.stop(audio.currentTime + .6);
  } catch {}
  try { navigator.vibrate?.(300); } catch {}
}
function tickTimer() {
  const b = $("#timerBtn");
  if (!b || !S.card) return;
  const key = S.tick + ":" + S.turn;
  if (L.timerFor !== key || !L.timerEnd) { b.className = "timer"; b.textContent = `Start ${S.card.timer}s timer`; return; }
  const left = Math.ceil((L.timerEnd - Date.now()) / 1000);
  if (left > 0) { b.className = "timer run"; b.textContent = `${left}s left · tap to restart`; }
  else { b.className = "timer out"; b.textContent = "Time's up · tap to restart"; }
}
setInterval(() => {
  if (!L.timerEnd) return;
  const was = $("#timerBtn")?.classList.contains("run");
  tickTimer();
  if (was && Date.now() >= L.timerEnd) beep();
}, 250);

document.addEventListener("submit", e => {
  if (e.target.id !== "addForm") return;
  e.preventDefault();
  const v = $("#newName").value.trim();
  if (!v) return;
  if (S.players.length >= 12) return toast("12 players max");
  mutate(() => S.players.push(newPlayer({ name: v })), false);
  $("#newName").focus();
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "meSel") { L.me = +t.value; save(); return render(); }
  const key = t.dataset.set;
  if (!key) return;
  mutate(() => {
    const p = S.players[+t.dataset.i];
    p[key] = key === "kg" ? Math.min(200, Math.max(35, +t.value || 70)) : t.value;
    if (key === "drink") p.glass = DRINKS[t.value].glass;
  }, false);
});

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t || t.disabled) return;
  const c = S.card;
  if (t.dataset.del !== undefined) return mutate(() => { S.players.splice(+t.dataset.del, 1); S.missions = []; S.refills = []; S.penalty = -1; if (S.turn >= S.players.length) S.turn = 0; });
  if (t.dataset.lvl) return mutate(() => { S.level = +t.dataset.lvl; S.deck = []; }, false);
  if (t.dataset.len) return mutate(() => { S.length = +t.dataset.len; }, false);
  if (t.dataset.theme) return mutate(() => { S.theme = t.dataset.theme; S.deck = []; }, false);
  if (t.id === "start") { L.screen = "game"; return mutate(() => { if (!S.deck.length) buildDeck(); if (S.turn >= S.players.length) S.turn = 0; }, false); }
  if (t.id === "reset" || t.id === "again") { L.screen = "game"; return mutate(() => resetGame()); }
  if (t.id === "menu") { L.screen = "setup"; return render(); }
  if (t.id === "install") return installApp();
  if (t.id === "fan") {
    t.getAnimations({ subtree: true }).forEach(a => { a.cancel(); a.play(); });
    return;
  }
  if (t.id === "play") { L.screen = "setup"; scrollTo(0, 0); return render(); }
  if (t.id === "continue") { L.screen = "game"; scrollTo(0, 0); return render(); }
  if (t.id === "home") { L.screen = "welcome"; scrollTo(0, 0); return render(); }
  if (t.id === "undo") return undo();
  if (t.id === "end") return mutate(() => { S.over = true; });
  if (t.id === "drawBtn") return draw();
  if (t.id === "skipTurn") return mutate(next);
  if (t.id === "reveal") { L.reveal = true; flipNext = true; return render(); }
  if (t.id === "timerBtn") { audio = audio || (() => { try { return new (window.AudioContext || window.webkitAudioContext)(); } catch {} })(); L.timerFor = S.tick + ":" + S.turn; L.timerEnd = Date.now() + c.timer * 1000; return tickTimer(); }
  if (t.id === "host") return host();
  if (t.id === "join") return join($("#joinCode").value);
  if (t.id === "leave") return leave();
  if (t.dataset.peek) { L.peek[t.dataset.peek] = !L.peek[t.dataset.peek]; return render(); }
  if (t.dataset.clr !== undefined) return mutate(() => S.rules.splice(+t.dataset.clr, 1));
  if (t.dataset.refill) {
    const i = S.refills[0], p = S.players[i], how = t.dataset.refill;
    return mutate(() => {
      if (how === "left") { S.penalty = i; p.nursed++; return; }
      // What's left is a guess: about a quarter glass, logged so the promille estimate stays honest.
      if (how === "finished") { const rest = Math.ceil(glassSips(p) / 4); p.sips += rest; p.first = p.first || Date.now(); p.peak = Math.max(p.peak, promille(p)); toast(`${p.name} +${rest} sips for the rest`); }
      if (how === "water") p.water++;
      p.sinceRefill = 0;
      S.penalty = -1;
      S.refills.shift();
    });
  }
  if (t.dataset.mission !== undefined) {
    const m = S.missions[+t.dataset.mission], ok = t.dataset.ok === "1";
    return mutate(() => {
      S.missions.splice(+t.dataset.mission, 1);
      if (ok) { S.players[m.p].won++; sip(m.o, m.sips); bump(m.o); }
      else { sip(m.p, m.sips); bump(m.p); }
      toast(ok ? `${S.players[m.p].name} pulled it off. ${S.players[m.o].name} drinks ${m.sips}.` : `${S.players[m.p].name} got busted and drinks ${m.sips}.`);
    });
  }
  if (t.classList.contains("chip")) {
    const i = +t.dataset.i;
    return mutate(() => { addSips(i, 1); if (S.gift && i !== S.turn) S.gift--; });
  }
  if (t.dataset.pick !== undefined) {
    const i = +t.dataset.pick;
    return mutate(() => { S.picked = S.picked.includes(i) ? S.picked.filter(x => x !== i) : [...S.picked, i]; }, false);
  }
  if (t.dataset.vote !== undefined) {
    const i = +t.dataset.vote;
    return mutate(() => { if (S.votes[L.me] === i) delete S.votes[L.me]; else S.votes[L.me] = i; }, false);
  }
  const act = t.dataset.act;
  if (!act) return;
  if (act === "pickall") return mutate(() => { S.picked = S.picked.length === S.players.length ? [] : S.players.map((_, i) => i); }, false);
  mutate(() => {
    const P = S.players;
    if (act === "done" && (c.kind === "dare" || c.kind === "truth")) P[c.p].done++;
    if (act === "refuse") { P[c.p].refused++; addSips(c.p, c.sips); }
    if (act === "rule") { S.rules.push({ p: c.p, o: c.o, q: c.q, lead: c.lead, text: c.text, by: P[c.p].name }); P[c.p].made++; }
    if (act === "lose") addSips(+t.dataset.who, c.sips);
    if (act === "water") P[c.p].water++;
    if (act === "mission") S.missions.push({ id: S.tick + "-" + c.p, p: c.p, o: c.o, q: c.q, lead: c.lead, text: c.text, sips: c.sips });
    if (act === "settle") {
      const a = Object.values(S.votes).filter(v => v === c.p).length, b = Object.values(S.votes).filter(v => v === c.o).length;
      if (a >= b) sip(c.p, c.sips);
      if (b >= a) sip(c.o, c.sips);
      toast(a === b ? `Tie. ${P[c.p].name} and ${P[c.o].name} both drink ${c.sips}.` : `${P[a > b ? c.p : c.o].name} lost the vote and drinks ${c.sips}.`);
    }
    if (act === "pickdone") {
      S.picked.forEach(i => { sip(i, c.sips); bump(i); });
      if (S.picked.length) toast(`${S.picked.length === P.length ? "Everyone" : S.picked.map(i => P[i].name).join(", ")} +${c.sips}`);
    }
    next();
  });
});

function resetGame() {
  S.players.forEach(p => Object.assign(p, { sips: 0, first: 0, peak: 0, refused: 0, done: 0, made: 0, won: 0, water: 0, lastPicked: 0, sinceRefill: 0, nursed: 0 }));
  S.refills = [];
  Object.assign(S, { turn: 0, tick: 0, round: 1, card: null, rules: [], missions: [], gift: 0, picked: [], votes: {}, over: false });
  buildDeck();
}

// Shared tables: the whole game lives in one db document, tables/<CODE>; last write wins.
let db = null, dbTried = false, tableRef = null, unsub = null, writing = false, pending = false;
async function push() {
  if (!tableRef) return;
  if (writing) { pending = true; return; }
  writing = true;
  do {
    pending = false;
    try {
      await tableRef.set({ state: JSON.stringify(Object.assign({}, S, { history: S.history.slice(-5) })), by: TAB, at: Date.now() });
    } catch (e) {
      toast(e?.code === "permission_denied" ? "You can watch but not play. Ask the host for Contributor access." : "Couldn't sync that change. Check your connection.");
    }
  } while (pending);
  writing = false;
}
function listen(code) {
  if (unsub) unsub();
  L.code = code; L.sync = "";
  tableRef = db.doc("tables/" + code);
  unsub = tableRef.onSnapshot(snap => {
    L.sync = "live";
    if (snap.exists) {
      const d = snap.data();
      if (d.by !== TAB) {
        try { S = fresh(JSON.parse(d.state)); } catch { return toast("Got a broken update from another phone. Ignored it."); }
      }
    }
    render();
  }, () => { L.sync = ""; toast("Lost the table connection."); render(); });
  save();
}
async function host() {
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const code = Array.from({ length: 4 }, () => abc[Math.floor(Math.random() * abc.length)]).join("");
  L.me = S.players.length ? 0 : -1;
  listen(code);
  await push();
  toast(`Table ${code} is open`);
}
async function join(raw) {
  const code = String(raw || "").trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(code)) return toast("Enter the 4-letter table code");
  try {
    const snap = await db.doc("tables/" + code).get();
    if (!snap.exists) return toast(`No table called ${code}. Check the code with the host.`);
    S = fresh(JSON.parse(snap.data().state));
    L.me = -1;
    listen(code);
    toast(`Joined ${code}. Pick who you are below.`);
  } catch { toast("Couldn't reach that table. Try again."); }
}
function leave() {
  if (unsub) unsub();
  unsub = null; tableRef = null; L.code = ""; L.sync = ""; L.me = -1;
  render();
}

  const w = innerWidth, h = innerHeight, size = 64, gap = 74;

  const run = (svg, lead) => {
    const el = document.createElement("div");
    el.className = "bat-fly runner";
    el.style.width = size + "px";
    el.innerHTML = svg;
    if (!ltr) el.firstElementChild.style.transform = "scaleX(-1)";

    return el.animate(frames, { duration: dur, easing: "linear", fill: "both" }).finished.then(() => el.remove(), () => el.remove());
  };
  return Promise.all([run(front, true), run(back, false)]);
}

// Seasonal visitors take turns, one crossing on screen at a time, 20 seconds apart, so each shows up about once a minute.
// Halloween: witch first (4 seconds after the page opens), then the cat, then a bat. Christmas: Santa and Krampus chase each other.
const CRITTERS_BY_THEME = { halloween: [spawnWitch, spawnCat, () => spawnBat(0)], christmas: [spawnChase] };
let critterBusy = false, critterNext = Date.now() + 4000, critterIdx = 0;
setInterval(() => {
  if (!S || S.theme === "classic" || document.hidden || critterBusy || Date.now() < critterNext) return;
  if (S.over && L.screen === "game") return; // the awards page belongs to the sitting cat alone
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  critterBusy = true;
  const list = CRITTERS_BY_THEME[S.theme];
  const crossing = list[critterIdx++ % list.length]();
  const giveUp = new Promise(r => setTimeout(r, 20000)); // never let a stalled animation block the queue
  Promise.race([crossing, giveUp]).finally(() => { critterBusy = false; critterNext = Date.now() + 20000; });
}, 1000);

// Promille drops over time, so refresh the numbers every minute while playing.
setInterval(() => { if (S && L.screen === "game") render(); }, 60000);

// Install on the phone (hosted copy only; claude.ai pages can't install or work offline).
// Android and desktop Chrome offer a real install prompt. iPhones have none, so the button explains the Share menu.
const installed = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let installEvent = null, iosHelp = false;
function paintInstall() {
  const slot = $("#installSlot");
  if (!slot) return;
  if (window.claude || installed() || !(installEvent || isIOS())) { slot.innerHTML = ""; return; }
  slot.innerHTML = `<button type="button" class="btn ghost" id="install">Add to home screen</button>${iosHelp ? `<p>Tap the Share button in your browser, then <b>Add to Home Screen</b>. The game then opens like an app and works offline.</p>` : ""}`;
}
async function installApp() {
  if (!installEvent) { iosHelp = !iosHelp; return paintInstall(); }
  const prompt = installEvent;
  installEvent = null;
  prompt.prompt();
  await prompt.userChoice.catch(() => {});
  paintInstall();
}
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; paintInstall(); });
addEventListener("appinstalled", () => { installEvent = null; paintInstall(); toast("Installed. Find Pour Decisions on your home screen."); });
if (!window.claude && "serviceWorker" in navigator && isSecureContext) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

function start(data) {
  S = fresh(data && data.S ? data.S : load());
  const loc = (data && data.L) || loadLocal();
  L.me = loc.me ?? -1;
  if (data && data.L) L.screen = data.L.screen || "welcome";
  render();
  (window.claude?.use ? window.claude.use("db") : Promise.resolve(null)).then(d => {
    db = d; dbTried = true;
    if (db && loc.code) listen(loc.code);
    render();
  }, () => { dbTried = true; render(); });
}
window.claude?.hot?.snapshot?.(() => ({ S, L: { screen: L.screen, code: L.code, me: L.me } }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
